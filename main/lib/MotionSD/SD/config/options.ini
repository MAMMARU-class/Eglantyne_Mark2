# Experiment option format version
version=1

# FIXED_MINIMUM, FIXED_MAXIMUM, or T_SUP_DEPENDENT
feedback_gain_mode=T_SUP_DEPENDENT

# NONE, PUSH, or STEP
disturbance_type=NONE

# When true, update_rate_gain.csv and procedure.csv are not loaded.
# A fixed-T_sup experiment is generated from the following three values.
single_T_sup_exp=true
single_T_sup=0.18
single_gain_p=6.0
single_gain_d=0.6

x0_vx0_kp=0.0047
x0_vx0_kd=0.000008

# Pitch error PD gains for next-foot x-position feedback
pitch_foot_kp=0.0
pitch_foot_kd=0.0

target_velocity_x=0.01
target_velocity_y=0.0
target_velocity_yaw=0.0
velocity_eps=0.0001

# Maximum number of control samples stored in RAM
log_row_count=4500
